<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anim8 Robot Editor</title>
<style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }

    /* Bottom frame timeline */
    #frame-timeline {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 200px;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(6px);
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        overflow-x: auto;
        padding: 8px 10px;
        box-sizing: border-box;
        z-index: 9998;
    }

    .frame-item {
        flex: 0 0 auto;
        width: 180px;
        margin-right: 8px;
        padding: 6px;
        box-sizing: border-box;
        background: #181818;
        border: 2px solid #333;
        border-radius: 4px;
        color: #ddd;
        font-family: sans-serif;
        font-size: 11px;
        cursor: pointer;
    }

    .frame-item.selected {
        border-color: #00aaff;
        box-shadow: 0 0 6px #00aaff;
    }

    .frame-thumb {
        width: 100%;
        height: 130px;
        object-fit: cover;
        background: #000;
        display: block;
        margin-bottom: 4px;
    }

    .frame-meta {
        margin-bottom: 2px;
    }

    .frame-slider {
        width: 100%;
    }

    .add-frame-button {
        flex: 0 0 auto;
        width: 60px;
        height: 180px;
        margin-left: 8px;
        background: #181818;
        border: 2px dashed #444;
        border-radius: 4px;
        color: #ccc;
        font-size: 40px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        user-select: none;
    }

    .add-frame-button:hover {
        border-color: #00aaff;
        color: #00aaff;
    }

    /* =====================================================
       MOTION PROPERTIES DIALOG
       ===================================================== */

    #motion-props-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 10000;
        align-items: center;
        justify-content: center;
    }

    #motion-props-overlay.open {
        display: flex;
    }

    #motion-props-dialog {
        background: #1e1e1e;
        border: 1px solid #444;
        border-radius: 6px;
        padding: 24px 28px;
        width: 480px;
        max-width: 95vw;
        color: #ddd;
        font-family: sans-serif;
        font-size: 13px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }

    #motion-props-dialog h2 {
        margin: 0 0 18px;
        font-size: 15px;
        color: #fff;
        border-bottom: 1px solid #333;
        padding-bottom: 10px;
    }

    #motion-props-dialog h3 {
        margin: 16px 0 10px;
        font-size: 13px;
        color: #aaa;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .props-row {
        display: flex;
        gap: 16px;
        margin-bottom: 12px;
    }

    .props-field {
        display: flex;
        flex-direction: column;
        flex: 1;
        gap: 4px;
    }

    .props-field label {
        font-size: 11px;
        color: #999;
    }

    .props-field input[type="text"],
    .props-field input[type="number"] {
        background: #2a2a2a;
        border: 1px solid #444;
        border-radius: 3px;
        color: #eee;
        padding: 5px 8px;
        font-size: 13px;
        width: 100%;
        box-sizing: border-box;
    }

    .props-field input[type="text"]:focus,
    .props-field input[type="number"]:focus {
        border-color: #00aaff;
        outline: none;
    }

    .props-check-row {
        display: flex;
        gap: 24px;
        margin-bottom: 10px;
    }

    .props-check-row label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        color: #ccc;
    }

    .props-section {
        background: #161616;
        border: 1px solid #2a2a2a;
        border-radius: 4px;
        padding: 10px 12px 6px;
        margin-bottom: 12px;
    }

    .props-section.disabled {
        opacity: 0.4;
        pointer-events: none;
    }

    .props-dialog-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
        padding-top: 14px;
        border-top: 1px solid #333;
    }

    .props-dialog-footer button {
        padding: 7px 20px;
        font-size: 13px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    #props-cancel-btn {
        background: #2a2a2a;
        color: #ccc;
    }

    #props-cancel-btn:hover { background: #333; }

    #props-ok-btn {
        background: #00aaff;
        color: #fff;
    }

    #props-ok-btn:hover { background: #0099ee; }
</style>

</head>
<body>

<!-- ============================
     CONTROL BUTTONS (USB + EXPORT)
     ============================ -->
<div id="usb-controls"
     style="
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 8px;
     ">

    <button onclick="connectRobot()"
            style="padding: 8px 14px; font-size: 14px;">
        Connect USB
    </button>

    <button onclick="startSync()"
            style="padding: 8px 14px; font-size: 14px;">
        Start Sync
    </button>

    <button onclick="stopSync()"
            style="padding: 8px 14px; font-size: 14px;">
        Stop Sync
    </button>

    <button onclick="openMotionProps()"
            style="padding: 8px 14px; font-size: 14px;">
        Motion Props
    </button>

    <!-- Hidden file input — triggered by the Open button below -->
    <input type="file" id="open-motion-input" accept=".json"
           style="display: none;">

    <button onclick="document.getElementById('open-motion-input').click()"
            style="padding: 8px 14px; font-size: 14px;">
        Open Motion
    </button>

    <button onclick="exportMotion()"
            style="padding: 8px 14px; font-size: 14px;">
        Export Motion
    </button>

</div>


<!-- ============================
     MOTION EDITOR CONTROLS
     ============================ -->
<div id="motion-controls"
     style="
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 8px;
     ">

    <button onclick="prevFrame()" style="padding: 8px 14px; font-size: 14px;">
        ◀ Previous
    </button>

    <button onclick="nextFrame()" style="padding: 8px 14px; font-size: 14px;">
        Next ▶
    </button>

    <button onclick="togglePlay()" style="padding: 8px 14px; font-size: 14px;">
        ▶ Play / Stop ⏹
    </button>

</div>


<!-- ============================
     FRAME TIMELINE (BOTTOM STRIP)
     ============================ -->
<div id="frame-timeline"></div>


<!-- ============================
     MOTION PROPERTIES DIALOG
     ============================ -->
<div id="motion-props-overlay">
    <div id="motion-props-dialog">
        <h2>Motion Properties</h2>

        <h3>Basic Properties</h3>
        <div class="props-row">
            <div class="props-field">
                <label>Slot</label>
                <input type="number" id="prop-slot" min="0" max="89" value="0">
            </div>
            <div class="props-field">
                <label>Name</label>
                <input type="text" id="prop-name" value="New Motion">
            </div>
        </div>

        <h3>Code Properties</h3>

        <div class="props-check-row">
            <label>
                <input type="checkbox" id="prop-loop-enabled">
                Loop function
            </label>
        </div>
        <div class="props-section" id="loop-section">
            <div class="props-row">
                <div class="props-field">
                    <label>Begin</label>
                    <input type="number" id="prop-loop-begin" min="0" value="0">
                </div>
                <div class="props-field">
                    <label>End (Max = 10)</label>
                    <input type="number" id="prop-loop-end" min="0" max="10" value="0">
                </div>
                <div class="props-field">
                    <label>Count (255 = ∞)</label>
                    <input type="number" id="prop-loop-count" min="1" max="255" value="255">
                </div>
            </div>
        </div>

        <div class="props-check-row">
            <label>
                <input type="checkbox" id="prop-jump-enabled">
                Jump function
            </label>
        </div>
        <div class="props-section" id="jump-section">
            <div class="props-row">
                <div class="props-field">
                    <label>Begin</label>
                    <input type="number" id="prop-jump-begin" min="0" value="0">
                </div>
                <div class="props-field">
                    <label>End (Max = 10)</label>
                    <input type="number" id="prop-jump-end" min="0" max="10" value="0">
                </div>
                <div class="props-field">
                    <label>Slot</label>
                    <input type="number" id="prop-jump-slot" min="0" max="89" value="0">
                </div>
            </div>
        </div>

        <div class="props-dialog-footer">
            <button id="props-cancel-btn" onclick="closeMotionProps()">Cancel</button>
            <button id="props-ok-btn" onclick="saveMotionProps()">OK</button>
        </div>
    </div>
</div>


<!-- ============================
     SCRIPT MODULES
     ============================ -->
<script type="module">
    import './app.js';
</script>

<script>
    document.getElementById("prop-loop-enabled").addEventListener("change", function() {
        document.getElementById("loop-section").classList.toggle("disabled", !this.checked);
    });
    document.getElementById("prop-jump-enabled").addEventListener("change", function() {
        document.getElementById("jump-section").classList.toggle("disabled", !this.checked);
    });

    document.getElementById("loop-section").classList.add("disabled");
    document.getElementById("jump-section").classList.add("disabled");
</script>

</body>
</html>
