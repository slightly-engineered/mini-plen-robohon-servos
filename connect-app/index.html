<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>RoBoHoN Control</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="icon-grid">

    <!-- Row 1 -->
    <button class="icon-btn" data-slot="1">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      <div class="icon-label">Forward</div>
    </button>

    <button class="icon-btn" data-slot="2">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg>
      <div class="icon-label">Right Fwd</div>
    </button>

    <button class="icon-btn" data-slot="3">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      <div class="icon-label">Right</div>
    </button>

    <!-- Row 2 -->
    <button class="icon-btn" data-slot="4">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <div class="icon-label">Left</div>
    </button>

    <button class="icon-btn" data-slot="5">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.82 1c0 2-3 2.5-3 4"/><line x1="12" y1="17.5" x2="12" y2="17.51"/></svg>
      <div class="icon-label">Pose</div>
    </button>

    <button class="icon-btn" data-slot="6">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7L7 17M17 17H7V7"/></svg>
      <div class="icon-label">Left Back</div>
    </button>

    <!-- Row 3 -->
    <button class="icon-btn" data-slot="7">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
      <div class="icon-label">Back</div>
    </button>

    <button id="micButton" class="mic-btn">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>

    <button class="icon-btn" data-slot="8">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0"/><path d="M14 10V4a2 2 0 0 0-4 0v2"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
      <div class="icon-label">Wave</div>
    </button>

  </main>

  <!-- Motion Upload Section -->
  <section class="upload-panel">
    <h3>Upload Motion</h3>

    <label>Choose JSON Motion File:</label>
    <input type="file" id="motionFile" accept=".json">

    <label>Slot:</label>
    <select id="motionSlot">
      <option value="1">Slot 1</option>
      <option value="2">Slot 2</option>
      <option value="3">Slot 3</option>
      <option value="4">Slot 4</option>
      <option value="5">Slot 5</option>
      <option value="6">Slot 6</option>
      <option value="7">Slot 7</option>
      <option value="8">Slot 8</option>
    </select>

    <button id="uploadMotion" class="footer-btn">Upload Motion</button>

    <!-- NEW BUTTON -->
    <button id="playSlot1" class="footer-btn">Play Slot</button>
  </section>

  <footer class="bottom-bar">
    <button id="connect" class="footer-btn">
      Connect <span id="statusDot" class="dot gray"></span>
    </button>
    <button id="joystick" class="footer-btn">Joystick</button>
    <button id="advanced" class="footer-btn">Advanced</button>
  </footer>

  <pre id="log"></pre>

  <script type="module" src="app.js"></script>
</body>
</html>
